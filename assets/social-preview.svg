<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="plain-language">
  <!-- GitHub social preview, 1280x640. GitHub takes PNG, not SVG, so
       social-preview.png beside this file is what gets uploaded; it was
       rendered from here with Atkinson Hyperlegible loaded.
       Nothing here but the name, so nothing here goes stale. -->
  <rect width="1280" height="640" fill="#F6F3EC"/>
  <g transform="translate(524.8 110) scale(3.6)">
    <path d="M10 32H40" fill="none" stroke="#222831" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="32" r="5" fill="#C8552D"/>
  </g>
  <text x="640" y="430" text-anchor="middle" fill="#222831"
        font-family="Atkinson Hyperlegible, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="104" letter-spacing="1">plain-language</text>
</svg>
