<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plain-language comparison</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #59636e;
    --line: #d0d7de;
    --panel: #f6f8fa;
    --pane-a: #f4f6f9;
    --pane-b: #eaeef3;
    --pane-header: #d9e0e8;
    --accent: #0969da;
    --error: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK JP", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }
  header {
    padding: 20px 28px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
  .prompt-box {
    margin: 0 0 14px;
    padding: 8px 14px 10px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    background: var(--panel);
  }
  .prompt-box .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .prompt .first-line { font-size: 17px; font-weight: 600; }
  details.prompt summary {
    cursor: pointer;
    list-style: none;
    font-size: 17px;
    font-weight: 600;
  }
  details.prompt summary::-webkit-details-marker { display: none; }
  details.prompt summary::after {
    content: "show all";
    margin-left: 10px;
    font-size: 12px;
    font-weight: 400;
    color: var(--accent);
  }
  details.prompt[open] summary::after { content: "hide"; }
  details.prompt pre {
    white-space: pre-wrap;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 8px 0 0;
    font-family: inherit;
  }
  details.prompt .source-label { font-weight: 600; margin-top: 8px; }
  .about-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }
  table.about { border-collapse: collapse; font-size: 13px; }
  table.about th, table.about td {
    text-align: left;
    padding: 3px 14px 3px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.about th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .toolbar {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .toolbar .group { display: flex; align-items: center; gap: 6px; }
  button.chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    padding: 2px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  main {
    display: grid;
    grid-template-columns: repeat(var(--pane-count), minmax(0, 1fr)) 44px;
  }
  .pane { border-right: 1px solid var(--line); min-width: 0; background: var(--pane-a); }
  .pane:nth-child(even) { background: var(--pane-b); }
  .pane-header {
    position: sticky;
    top: 0;
    background: var(--pane-header);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px 8px;
    z-index: 1;
  }
  .pane-header .selectors { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .pane-header .field { display: flex; flex-direction: column; gap: 2px; }
  .pane-header .field .caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pane-header select {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    max-width: 100%;
  }
  .pane-header select.sample { font-weight: 400; }
  .pane-header .close {
    margin-left: auto;
    align-self: flex-start;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .pane-header .stats { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .add-pane {
    position: sticky;
    top: 0;
    align-self: start;
    display: flex;
    justify-content: center;
    padding-top: 10px;
  }
  .add-pane button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .sample { padding: 16px 20px 40px; overflow-wrap: anywhere; }
  .sample .failure { color: var(--error); white-space: pre-wrap; }
  .sample h1, .sample h2, .sample h3, .sample h4 { line-height: 1.35; margin: 1.4em 0 0.5em; }
  .sample h1 { font-size: 1.35em; } .sample h2 { font-size: 1.2em; } .sample h3 { font-size: 1.05em; }
  .sample h1:first-child, .sample h2:first-child { margin-top: 0; }
  .sample pre {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 13px;
  }
  .sample code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.92em; }
  .sample :not(pre) > code { background: #ffffff; padding: 1px 5px; border-radius: 4px; }
  .sample table { border-collapse: collapse; margin: 0.6em 0; display: block; overflow-x: auto; }
  .sample th, .sample td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .sample th, .sample td { background: #ffffff; }
  .sample th { font-weight: 600; }
  .sample blockquote { margin: 0.6em 0; padding: 0 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .sample img { max-width: 100%; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .pane { border-right: none; border-bottom: 1px solid var(--line); }
    .add-pane { position: static; padding: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>plain-language comparison</h1>
  <div class="prompt-box"><div class="label">Prompt</div><div id="prompt"></div></div>
  <div class="about-label">Setup</div>
  <table class="about" id="about"></table>
  <div class="toolbar">
    <div class="group" id="sample-buttons"><span>Sample in every pane:</span></div>
  </div>
</header>
<main id="panes"></main>

const sampleTexts = {"claude-fable-5-1": {"HEAD": {"1": "「外部ツールの使用ルール」セクションの本文です。SKILL.md にそのまま貼り付けられるように Markdown で書きました。ID は既存のスキルの体系が分からないので仮に T1 から T8 としています。\n\n````markdown\n## 外部ツールの使用ルール\n\n外部ツールを取り込む、実行する、選ぶ、不具合を報告するときは、次のルールに従う。\n\n| ID | 名前 | 要約 |\n| --- | --- | --- |\n| T1 | 版の固定 | 検証済みの特定の公開物に固定する |\n| T2 | ハッシュ照合 | 配布元の sha256 と照合する |\n| T3 | 保存と再利用 | 利用者ディレクトリに保存し再利用する |\n| T4 | 非同期実行 | 端末を占有せず、終了時に結果を報告する |\n| T5 | 資源の上限 | 資源に上限を設け、近づいたら知らせる |\n| T6 | ロールバック | 問題が起きたら直前の公開物に戻す |\n| T7 | 候補の比較 | 候補ごとに得るものと失うものを比べる |\n| T8 | 不具合報告 | 保守者に再現手順を添えて報告する |\n\n### T1 公開物の版を固定する\n\n**方針** 外部ツールを取り込むときは、検証済みの特定の公開物に固定する。最新の公開物を自動的に選ぶ指定は使わない。\n\n**理由** 最新の公開物は取り込むたびに変わり、前回確かめた動作が今回も保たれる保証がない。特定の公開物に固定すると、同じ手順が同じ結果を再現する。\n\n**例**\n\n| 指定 | 判定 |\n| --- | --- |\n| `latest` | 使わない |\n| `main` ブランチの先頭 | 使わない |\n| `v2.3.1` | 使う |\n\n### T2 sha256 を照合する\n\n**方針** 取り込んだ公開物は、配布元が示す sha256 の値と一致するかを確かめてから使う。一致しない公開物は使わない。\n\n**理由** 配信経路の途中で内容が置き換わっても、ファイル名やバージョンからは分からない。sha256 の値を照合すると、配布元が公開した内容と同じであることを確かめられる。\n\n**例**\n\n| 手順 | 内容 |\n| --- | --- |\n| 1 | 配布元のページに載っている sha256 の値を控える |\n| 2 | `sha256sum tool-v2.3.1.tar.gz` で値を計算する |\n| 3 | 二つの値が一致することを確かめる |\n\n### T3 保存して再利用する\n\n**方針** 取り込んだ公開物は、ログインしている利用者に割り当てられたディレクトリの直下に保存する。二度目以降は保存した公開物を再利用し、取り込み直さない。\n\n**理由** 同じ公開物を毎回取り込むと、時間と通信量を使い、配布元の障害で作業が止まる。利用者ディレクトリに置くと、他の利用者の作業と混ざらず、書き込み権限の問題も起きにくい。\n\n**例**\n\n| 環境 | 保存先 |\n| --- | --- |\n| Linux、macOS | `$HOME/tool-v2.3.1/` |\n| Windows | `%USERPROFILE%\\tool-v2.3.1\\` |\n\n### T4 端末を占有しない\n\n**方針** 時間のかかる処理は、端末を占有しない形で動かす。処理が終わったら、結果を依頼者に報告する。\n\n**理由** 端末を占有すると、処理が終わるまで依頼者は他の操作ができない。終了時に報告すれば、依頼者は待たずに済み、結果を見落とさない。\n\n**例**\n\n| 処理時間 | 動かし方 |\n| --- | --- |\n| 数秒 | そのまま実行する |\n| 数分以上 | バックグラウンドで実行し、終了時に結果を報告する |\n\n### T5 資源に上限を設ける\n\n**方針** 処理が消費する CPU、メモリ、ディスクの量には上限を設ける。使用量が上限に近づいたら、依頼者に知らせる。\n\n**理由** 上限がないと、一つの処理が計算機全体を止めることがある。上限に近づいた時点で知らせると、依頼者は処理を止めるか上限を上げるかを選べる。\n\n**例**\n\n| 資源 | 上限 | 知らせる目安 |\n| --- | --- | --- |\n| CPU 時間 | 30 分 | 24 分 |\n| メモリ | 4 GB | 3.2 GB |\n| ディスク | 20 GB | 16 GB |\n\n### T6 直前の公開物に戻す\n\n**方針** 新しい公開物に切り替えて問題が起きたら、直前に使っていた公開物に戻す。\n\n**理由** 新しい公開物の問題を調べる間も、作業は続ける必要がある。T3 で保存した直前の公開物が残っていれば、すぐに戻して作業を続けられる。\n\n**例**\n\n| 段階 | 公開物 |\n| --- | --- |\n| 切り替え前 | `v2.3.1` |\n| 切り替え後に問題 | `v2.4.0` |\n| 戻す先 | `v2.3.1` |\n\n### T7 候補を並べて比べる\n\n**方針** ツールを選ぶときは、候補ごとに得られるものと失うものを並べて比べる。一つの候補だけを見て決めない。\n\n**理由** 一つの候補だけを見ると、利点は目に入り、欠点は見落とす。並べて比べると、依頼者は選択の根拠を確かめられる。\n\n**例**\n\n| 候補 | 得るもの | 失うもの |\n| --- | --- | --- |\n| A | 導入の手軽さ | 設定の自由度 |\n| B | 設定の自由度 | 学習にかかる時間 |\n\n### T8 再現手順を添えて報告する\n\n**方針** ツールに不具合を見つけたら、そのツールの保守者に、再現手順を添えて報告する。\n\n**理由** 再現手順がない報告では、保守者は問題を再現できず、修正に進めない。手順があれば、保守者は原因を特定しやすい。\n\n**例**\n\n| 項目 | 内容 |\n| --- | --- |\n| 公開物 | `v2.4.0` |\n| 環境 | Windows 11 Pro |\n| 手順 | `tool run --input a.txt` を実行する |\n| 期待 | `a.out` が生成される |\n| 実際 | 終了コード 2 で停止し、ファイルが生成されない |\n\n### 用語\n\n- 公開物 — 配布元がバージョンを付けて配布する、ツールのファイルやパッケージ。リリースともいう。\n- 配布元 — 公開物を公開している組織や場所。GitHub のリリースページやパッケージレジストリなど。\n- 検証済み — 動作と sha256 の値を確かめた状態。\n- sha256 — ファイルの内容から計算する値。内容が変わると値も変わる。\n- 利用者ディレクトリ — ログインしている利用者に割り当てられたディレクトリ。Linux と macOS では `$HOME`、Windows では `%USERPROFILE%`。\n- 依頼者 — 処理を依頼した人。\n- バックグラウンド — 端末を占有せずに処理を動かす形。動いている間も端末で他の操作ができる。\n- 資源 — 処理が消費する CPU、メモリ、ディスクの量。\n- 保守者 — ツールを保守している人。開発者や Issue に対応する人。\n- 再現手順 — 不具合を他の環境でも再現させるための、操作の順序と環境の情報。\n````\n\n文体は SKILL.md 向けに「である」体にしました。既存の SKILL.md が「です・ます」体なら、方針と理由の文末を合わせてください。見出しの階層は「##」をセクション、「###」を各ルールにしているので、既存の構成に応じて調整してください。"}, "worktree": {"1": "以下に「外部ツールの使用ルール」のセクション本文を書きます。既存の SKILL.md に貼り付けられるよう、Markdown のソースをそのまま示します。\n\n````markdown\n## 外部ツールの使用ルール\n\n外部ツールを取り込む、動かす、選ぶ、不具合を報告するときは、次のルールに従う。\n\n| ID | 名前 | 要約 |\n| --- | --- | --- |\n| T01 | バージョン固定 | 検証済みの特定リリースに固定する |\n| T02 | チェックサム検証 | sha256 を照合してから使う |\n| T03 | キャッシュ再利用 | ホームディレクトリに保存して再利用 |\n| T04 | バックグラウンド | 端末を占有せず動かし結果を報告 |\n| T05 | リソース上限 | 上限を設け、近づいたら知らせる |\n| T06 | ロールバック | 問題が起きたら直前のリリースに戻す |\n| T07 | トレードオフ比較 | 候補ごとに利点と欠点を並べる |\n| T08 | バグ報告 | 再現手順を添えてメンテナーに報告 |\n\n### T01 バージョンを固定する\n\n**方針** 外部ツールを取り込むときは、最新のリリースではなく、検証済みの特定のバージョンを指定する。バージョンは番号かタグで書き、`latest` のように内容が変わる指定は使わない。\n\n**理由** 最新のリリースは時間とともに変わる。そのため、同じ手順を実行しても結果が再現せず、検証していない変更が入り込む。\n\n**例**\n\n| 指定 | 例 | 判定 |\n| --- | --- | --- |\n| バージョン | `ripgrep 14.1.0` | 従う |\n| 最新 | `ripgrep latest` | 避ける |\n\n### T02 チェックサムを検証する\n\n**方針** 取り込んだリリースは、配布元が示す `sha256` の値と一致するかを確かめてから使う。一致しないときは使わない。\n\n**理由** ダウンロードは途中で壊れることがあり、配布経路で改ざんされることもある。チェックサムが一致すれば、配布元が公開したものと同じ内容だと確認できる。\n\n**例**\n\n| 手順 | 内容 |\n| --- | --- |\n| 取得 | 配布元のリリースページで `sha256` の値を確認する |\n| 計算 | `sha256sum ripgrep-14.1.0.tar.gz` を実行する |\n| 判定 | 一致すれば使う。一致しなければ使わない |\n\n### T03 キャッシュを再利用する\n\n**方針** 取り込んだリリースは、ホームディレクトリの直下に保存する。二度目以降は、保存したものを再利用し、取得し直さない。\n\n**理由** 同じリリースを毎回取得すると、時間と通信量を消費し、配布元が利用できないときに作業が止まる。ホームディレクトリは利用者ごとに分かれているので、他の利用者の保存物と混ざらない。\n\n**例**\n\n| 項目 | 内容 |\n| --- | --- |\n| 保存先 | `~/ripgrep-14.1.0/` |\n| 初回 | 取得し、チェックサムを検証して保存する |\n| 二度目以降 | 保存先にあれば、それを使う |\n\n### T04 バックグラウンドで動かす\n\n**方針** 時間のかかる処理は、バックグラウンドで動かし、端末を占有しない。処理が終わったら、結果を依頼者に報告する。\n\n**理由** 端末を占有すると、処理が終わるまで他の作業ができない。バックグラウンドで動かすと、依頼者は待ち時間に別の作業を進められる。\n\n**例**\n\n| 項目 | 内容 |\n| --- | --- |\n| 対象 | 10 分かかるビルド |\n| 実行 | バックグラウンドで開始し、出力をログファイルに書く |\n| 報告 | 終了コードと成果物のパスを報告する |\n\n### T05 リソースに上限を設ける\n\n**方針** 処理が消費する CPU、メモリ、ディスクの量には上限を設ける。消費量が上限に近づいたら、依頼者に知らせる。\n\n**理由** 上限がないと、一つの処理が計算機のリソースを使い切り、他の処理や端末の操作に影響する。上限に近づいた時点で知らせると、依頼者は処理を止めるか上限を上げるかを選べる。\n\n**例** 値は例であり、環境に合わせて決める。\n\n| リソース | 上限 | 通知 |\n| --- | --- | --- |\n| CPU | 2 コア | 使用率 80% |\n| メモリ | 4 GB | 3.2 GB |\n| ディスク | 20 GB | 16 GB |\n\n### T06 ロールバックする\n\n**方針** 新しいリリースに切り替えて問題が起きたら、直前に使っていたリリースに戻す。\n\n**理由** 直前のリリースは動作を確認済みである。そのため、戻せば作業を続けられ、問題の調査を切り離して進められる。\n\n**例**\n\n| 手順 | 内容 |\n| --- | --- |\n| 切り替え | `14.1.0` から `15.0.0` に上げる |\n| 問題 | 出力形式が変わり、後続の処理が失敗する |\n| 戻す | `14.1.0` に戻す |\n\n### T07 トレードオフを比べる\n\n**方針** ツールを選ぶときは、候補ごとに得るものと失うものを並べて比べる。一つの候補の利点だけを見て決めない。\n\n**理由** どのツールにも利点と欠点がある。並べて比べると、選択の根拠が残り、後から見直せる。\n\n**例**\n\n| 候補 | 得るもの | 失うもの |\n| --- | --- | --- |\n| ripgrep | 検索速度 | インストールの手間 |\n| grep | 追加インストール不要 | 検索速度 |\n\n### T08 バグを報告する\n\n**方針** ツールに不具合を見つけたら、そのツールのメンテナーに報告する。報告には再現手順を添える。\n\n**理由** 再現手順があれば、メンテナーは不具合を自分の環境で確認でき、修正に取りかかれる。手順がない報告は、確認に時間がかかるか、対応されない。\n\n**例**\n\n| 項目 | 内容 |\n| --- | --- |\n| 報告先 | ツールのリポジトリの Issue |\n| 環境 | ツールのバージョンと OS |\n| 手順 | 実行したコマンドと入力 |\n| 結果 | 期待した結果と実際の結果 |\n\n### 用語\n\n- リリース — 配布元が公開した、特定のバージョンのツールの成果物。\n- バージョン固定 — 使うリリースを特定のバージョンに限定し、自動で更新しないこと。\n- チェックサム — ファイルの内容から計算した値。`sha256` はその計算方法の一つ。\n- ホームディレクトリ — ログインしている利用者に割り当てられたディレクトリ。\n- キャッシュ — 再利用のために保存した、取得済みのリリース。\n- バックグラウンド — 端末を占有せずに処理を動かす実行形態。\n- リソース — 処理が消費する CPU、メモリ、ディスクの量。\n- ロールバック — 直前に使っていたリリースに戻すこと。\n- トレードオフ — 一方を得ると他方を失う関係。\n- メンテナー — ツールを保守している人。\n- 再現手順 — 不具合を再び起こすための操作の手順。\n- 依頼者 — 処理を依頼した人。\n````\n\n執筆時の判断を三つ補足します。\n\n- **文体** は仕様書向けの「である」体にしました。既存の SKILL.md が「です・ます」体なら、そちらに合わせて直してください。\n- **ID** は既存の体系が分からないため T01 から T08 としました。見出しは `##` と `###` を使っています。\n- **用語** は、依頼文で説明的に書かれていた概念を定着した用語に置き換えました。「検証済みの特定の公開物に固定する」はバージョン固定、「利用者に割り当てられたディレクトリ」はホームディレクトリ、「直前の公開物に戻す」はロールバックです。"}}};

// A cell is one set of principles under one model. Panes show one sample of
// one cell each; the reader arranges the panes.
const cells = [];
for (const model of comparison.models) {
  for (const principles of comparison.principles) {
    cells.push({ modelLabel: model.label, principles: principles });
  }
}
// A pane can also show the source text the prompt works on, when there is one.
const SOURCE_PANE = -1;
const hasSource = Boolean(promptTexts.source);
let panes = [];

function isSourcePane(pane) {
  return pane.cell === SOURCE_PANE;
}

function cellNumberOf(modelLabel, principlesName) {
  return cells.findIndex(cell => cell.modelLabel === modelLabel && cell.principles.name === principlesName);
}

function samplesOf(cell) {
  return comparison.samples
    .filter(sample => sample.model_label === cell.modelLabel && sample.principles === cell.principles.name)
    .sort((left, right) => left.index - right.index);
}

function sampleText(cell, index) {
  const byPrinciples = sampleTexts[cell.modelLabel] || {};
  const byIndex = byPrinciples[cell.principles.name] || {};
  return byIndex[String(index)] || "";
}

function maxSampleIndex() {
  let highest = 0;
  for (const sample of comparison.samples) {
    if (sample.index > highest) highest = sample.index;
  }
  return highest;
}

function shortCommit(value) {
  if (typeof value !== "string") return "";
  return value.slice(0, 7);
}

function describePrinciples(principles) {
  if (principles.kind === "none") return "no principles";
  const parts = [];
  if (principles.kind === "git") {
    parts.push("git " + shortCommit(principles.commit));
  } else if (principles.kind === "worktree") {
    const edits = principles.uncommitted ? " with uncommitted edits" : "";
    parts.push("worktree at " + shortCommit(principles.base_commit) + edits);
  } else {
    parts.push(principles.kind);
  }
  if (principles.sha256) parts.push("sha256 " + shortCommit(principles.sha256));
  return parts.join(" · ");
}

function modelsUsed(modelLabel) {
  const used = new Set();
  for (const sample of comparison.samples) {
    if (sample.model_label === modelLabel && sample.model) used.add(sample.model);
  }
  return Array.from(used);
}

function formatStats(sample) {
  if (sample.is_error) return "failed";
  const parts = [];
  if (typeof sample.duration_ms === "number") parts.push((sample.duration_ms / 1000).toFixed(1) + " s");
  if (typeof sample.cost_usd === "number") parts.push("$" + sample.cost_usd.toFixed(3));
  const usage = sample.usage || {};
  if (typeof usage.output_tokens === "number") parts.push(usage.output_tokens + " output tokens");
  if (typeof usage.cache_read_input_tokens === "number" && usage.cache_read_input_tokens > 0) parts.push("cache read");
  return parts.join(" · ");
}

    sourceText.textContent = promptTexts.source;
    details.appendChild(sourceText);
  }
  container.appendChild(details);
}

function addAboutRow(table, title, lines) {
  const row = document.createElement("tr");
  const heading = document.createElement("th");
  heading.textContent = title;
  const value = document.createElement("td");
  for (const line of lines) {
    const div = document.createElement("div");
    div.textContent = line;
    value.appendChild(div);
  }
  row.appendChild(heading);
  row.appendChild(value);
  table.appendChild(row);
}

// The rows follow the order of the script's options: prompt, principles, agent.
function renderAbout() {
  const table = document.getElementById("about");
  addAboutRow(table, "Created", [comparison.created_at]);
  if (comparison.prompt.report) addAboutRow(table, "Report", [comparison.prompt.report]);
  addAboutRow(table, "Principles", comparison.principles.map(principles => principles.name + " — " + describePrinciples(principles)));
  const agent = comparison.agent || {};
  if (agent.name) addAboutRow(table, "Agent", [agent.name + (agent.version ? " " + agent.version : "")]);
  addAboutRow(table, "Models", comparison.models.map(model => {
    const used = modelsUsed(model.label);
    return model.label + (used.length ? " → " + used.join(", ") : "");
  }));
  addAboutRow(table, "Effort", [comparison.effort]);
}

function renderSampleButtons() {
  const group = document.getElementById("sample-buttons");
  for (let index = 1; index <= maxSampleIndex(); index++) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    button.textContent = String(index);
    button.addEventListener("click", () => {
      for (const pane of panes) {
        if (isSourcePane(pane)) continue;
        const cell = cells[pane.cell];
        if (samplesOf(cell).some(sample => sample.index === index)) pane.index = index;
      }
      renderPanes();
    });
    group.appendChild(button);
  }
}

function renderSampleBody(container, cell, sample) {
  container.innerHTML = "";
  if (!sample) {
    container.textContent = "No sample.";
    return;
  }
  if (sample.is_error) {
    const failure = document.createElement("div");
    failure.className = "failure";
    failure.textContent = "This sample failed.\n" + (sample.error || "");
    container.appendChild(failure);
    return;
  }
  container.innerHTML = marked.parse(sampleText(cell, sample.index), { gfm: true, breaks: false });
}

function makeField(caption, select) {
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("div");
  label.className = "caption";
  label.textContent = caption;
  field.appendChild(label);
  field.appendChild(select);
  return field;
}

function makeSelect(className, title, options, selectedValue, onChange) {
  const select = document.createElement("select");
  select.className = className;
  select.title = title;
  for (const candidate of options) {
    const option = document.createElement("option");
    option.value = candidate.value;
    option.textContent = candidate.text;
    option.selected = candidate.value === selectedValue;
    select.appendChild(option);
  }
  select.addEventListener("change", () => onChange(select.value));
  return select;
}

function principlesOptions() {
  const options = comparison.principles.map(principles => ({ value: principles.name, text: principles.name }));
  if (hasSource) options.unshift({ value: "source", text: "source" });
  return options;
}

function makeCloseButton(paneNumber) {
  const close = document.createElement("button");
  close.type = "button";
  close.className = "close";
  close.title = "Close this pane";
  close.textContent = "×";
  close.addEventListener("click", () => {
    panes.splice(paneNumber, 1);
    renderPanes();
  });
  return close;
}

function renderSourcePane(pane, paneNumber) {
  const section = document.createElement("section");
  section.className = "pane";
  const header = document.createElement("div");
  header.className = "pane-header";
  const selectors = document.createElement("div");
  selectors.className = "selectors";
  selectors.appendChild(makeField("Principles", makeSelect("principles", "Principles shown in this pane", principlesOptions(), "source", value => {
    movePaneToCell(pane, comparison.models[0].label, value);
    renderPanes();
  })));
  if (panes.length > 1) selectors.appendChild(makeCloseButton(paneNumber));
  header.appendChild(selectors);
  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = "the source text the prompt works on";
  header.appendChild(stats);
  const body = document.createElement("div");
  body.className = "sample";
  body.innerHTML = marked.parse(promptTexts.source, { gfm: true, breaks: false });
  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function movePaneToCell(pane, modelLabel, principlesName) {
  if (principlesName === "source" && hasSource) {
    pane.cell = SOURCE_PANE;
    return;
  }
  const cellNumber = cellNumberOf(modelLabel, principlesName);
  if (cellNumber < 0) return;
  pane.cell = cellNumber;
  const available = samplesOf(cells[cellNumber]);
  if (!available.some(candidate => candidate.index === pane.index) && available.length > 0) pane.index = available[0].index;
}

function renderPane(pane, paneNumber) {
  if (isSourcePane(pane)) return renderSourcePane(pane, paneNumber);
  const cell = cells[pane.cell];
  const samples = samplesOf(cell);
  const sample = samples.find(candidate => candidate.index === pane.index);

  const section = document.createElement("section");
  section.className = "pane";

  const header = document.createElement("div");
  header.className = "pane-header";
  const selectors = document.createElement("div");
  selectors.className = "selectors";

  selectors.appendChild(makeField("Principles", makeSelect("principles", "Principles shown in this pane", principlesOptions(), cell.principles.name, value => {
    movePaneToCell(pane, cell.modelLabel, value);
    renderPanes();
  })));

  const modelOptions = comparison.models.map(model => ({ value: model.label, text: model.label }));
  selectors.appendChild(makeField("Model", makeSelect("model", "Model shown in this pane", modelOptions, cell.modelLabel, value => {
    movePaneToCell(pane, value, cell.principles.name);
    renderPanes();
  })));

  const sampleOptions = samples.map(candidate => ({
    value: String(candidate.index),
    text: String(candidate.index) + (candidate.is_error ? " (failed)" : ""),
  }));
  selectors.appendChild(makeField("Sample", makeSelect("sample", "Sample shown in this pane", sampleOptions, String(pane.index), value => {
    pane.index = Number(value);
    renderPanes();
  })));

  if (panes.length > 1) selectors.appendChild(makeCloseButton(paneNumber));
  header.appendChild(selectors);

  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = sample ? formatStats(sample) : "";
  header.appendChild(stats);

  const body = document.createElement("div");
  body.className = "sample";
  renderSampleBody(body, cell, sample);

  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function renderAddPane() {
  const holder = document.createElement("div");
  holder.className = "add-pane";
  const button = document.createElement("button");
  button.type = "button";
  button.title = "Add a pane";
  button.textContent = "+";
  button.addEventListener("click", () => {
    const last = panes[panes.length - 1] || { cell: 0, index: 1 };
    const samples = isSourcePane(last) ? [] : samplesOf(cells[last.cell]);
    const next = samples.find(sample => sample.index > last.index);
    panes.push({ cell: last.cell, index: next ? next.index : last.index });
    renderPanes();
  });
  holder.appendChild(button);
  return holder;
}

function renderPanes() {
  const main = document.getElementById("panes");
  main.innerHTML = "";
  main.style.setProperty("--pane-count", String(panes.length));
  panes.forEach((pane, paneNumber) => main.appendChild(renderPane(pane, paneNumber)));
  main.appendChild(renderAddPane());
  writeArrangementToHash();
}

function defaultPanes() {
  const defaults = cells.map((cell, cellNumber) => {
    const samples = samplesOf(cell);
    return { cell: cellNumber, index: samples.length ? samples[0].index : 1 };
  });
  if (hasSource) defaults.unshift({ cell: SOURCE_PANE, index: 0 });
  return defaults;
}

// The arrangement lives in the URL fragment as
// "model,principles,index;model,principles,index", each label URI-encoded,
// with "source" for a pane that shows the source text, so that a link can
// carry a particular way of reading the comparison.
function writeArrangementToHash() {
  const parts = panes.map(pane => {
    if (isSourcePane(pane)) return "source";
    const cell = cells[pane.cell];
    return [encodeURIComponent(cell.modelLabel), encodeURIComponent(cell.principles.name), pane.index].join(",");
  });
  history.replaceState(null, "", "#" + parts.join(";"));
}

function readArrangementFromHash() {
  const hash = location.hash.replace(/^#/, "");
  if (hash === "") return null;
  const read = [];
  for (const part of hash.split(";")) {
    if (part === "source" && hasSource) {
      read.push({ cell: SOURCE_PANE, index: 0 });
      continue;
    }
    const fields = part.split(",");
    if (fields.length !== 3) continue;
    const cellNumber = cellNumberOf(decodeURIComponent(fields[0]), decodeURIComponent(fields[1]));
    const index = Number(fields[2]);
    if (cellNumber < 0 || !Number.isInteger(index)) continue;
    read.push({ cell: cellNumber, index: index });
  }
  return read.length ? read : null;
}

document.title = promptFirstLine().slice(0, 60) + " — plain-language comparison";
renderPrompt();
renderAbout();
renderSampleButtons();
panes = readArrangementFromHash() || defaultPanes();
renderPanes();
</script>
</body>
</html>
