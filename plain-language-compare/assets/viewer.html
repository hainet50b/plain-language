<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plain-language comparison</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #59636e;
    --line: #d0d7de;
    --panel: #f6f8fa;
    --pane-a: #f4f6f9;
    --pane-b: #eaeef3;
    --pane-header: #d9e0e8;
    --accent: #0969da;
    --error: #cf222e;
    /* Blue and vermilion from the Okabe-Ito palette stay apart for readers
       who do not tell red from green. */
    --good: #0072b2;
    --bad: #d55e00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK JP", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }
  header {
    padding: 20px 28px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
  .prompt-box {
    margin: 0 0 14px;
    padding: 8px 14px 10px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    background: var(--panel);
  }
  .prompt-box .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .prompt .first-line { font-size: 17px; font-weight: 600; }
  details.prompt summary {
    cursor: pointer;
    list-style: none;
    font-size: 17px;
    font-weight: 600;
  }
  details.prompt summary::-webkit-details-marker { display: none; }
  details.prompt summary::after {
    content: "show all";
    margin-left: 10px;
    font-size: 12px;
    font-weight: 400;
    color: var(--accent);
  }
  details.prompt[open] summary::after { content: "hide"; }
  details.prompt pre {
    white-space: pre-wrap;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 8px 0 0;
    font-family: inherit;
  }
  details.prompt .source-label { font-weight: 600; margin-top: 8px; }
  .about-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }
  table.about { border-collapse: collapse; font-size: 13px; }
  table.about th, table.about td {
    text-align: left;
    padding: 3px 14px 3px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.about th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .toolbar {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .toolbar .group { display: flex; align-items: center; gap: 6px; }
  .toolbar .annotation-controls { margin-left: auto; gap: 10px; }
  .toolbar .annotation-controls label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  button.chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    padding: 2px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  main {
    display: grid;
    grid-template-columns: repeat(var(--pane-count), minmax(0, 1fr)) 44px;
  }
  .pane { border-right: 1px solid var(--line); min-width: 0; background: var(--pane-a); }
  .pane:nth-child(even) { background: var(--pane-b); }
  .pane-header {
    position: sticky;
    top: 0;
    background: var(--pane-header);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px 8px;
    z-index: 1;
  }
  .pane-header .selectors { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .pane-header .field { display: flex; flex-direction: column; gap: 2px; }
  .pane-header .field .caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pane-header select {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    max-width: 100%;
  }
  .pane-header select.sample { font-weight: 400; }
  .pane-header .close {
    margin-left: auto;
    align-self: flex-start;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .pane-header .stats { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .add-pane {
    position: sticky;
    top: 0;
    align-self: start;
    display: flex;
    justify-content: center;
    padding-top: 10px;
  }
  .add-pane button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .sample { padding: 16px 20px 40px; overflow-wrap: anywhere; }
  .sample .failure { color: var(--error); white-space: pre-wrap; }
  .sample h1, .sample h2, .sample h3, .sample h4 { line-height: 1.35; margin: 1.4em 0 0.5em; }
  .sample h1 { font-size: 1.35em; } .sample h2 { font-size: 1.2em; } .sample h3 { font-size: 1.05em; }
  .sample h1:first-child, .sample h2:first-child { margin-top: 0; }
  .sample pre {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 13px;
  }
  .sample code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.92em; }
  .sample :not(pre) > code { background: #ffffff; padding: 1px 5px; border-radius: 4px; }
  .sample table { border-collapse: collapse; margin: 0.6em 0; display: block; overflow-x: auto; }
  .sample th, .sample td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .sample th, .sample td { background: #ffffff; }
  .sample th { font-weight: 600; }
  .sample blockquote { margin: 0.6em 0; padding: 0 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .sample img { max-width: 100%; }
  mark.annotation { color: inherit; border-radius: 2px; cursor: pointer; }
  mark.annotation.good { background: rgba(0, 114, 178, 0.18); box-shadow: inset 0 -2px 0 var(--good); }
  mark.annotation.bad {
    background: rgba(213, 94, 0, 0.18);
    text-decoration: underline wavy var(--bad);
    text-decoration-skip-ink: none;
  }
  .popover {
    position: absolute;
    z-index: 5;
    max-width: calc(100vw - 32px);
    padding: 10px 12px 12px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    font-size: 13px;
  }
  .popover .quote {
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }
  .popover .kind { font-weight: 600; margin-bottom: 4px; }
  .popover .kind.good { color: var(--good); }
  .popover .kind.bad { color: var(--bad); }
  .popover .note { white-space: pre-wrap; }
  .popover label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }
  .popover textarea, .popover input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 6px;
  }
  .popover textarea { min-height: 64px; resize: vertical; }
  .popover .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .popover .actions button { white-space: nowrap; }
  .popover .actions .spacer { flex: 1; }
  button.chip.good { border-color: var(--good); color: var(--good); }
  button.chip.bad { border-color: var(--bad); color: var(--bad); }
  button.chip:disabled { color: var(--muted); cursor: default; }
  .unsaved { color: var(--error); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .pane { border-right: none; border-bottom: 1px solid var(--line); }
    .add-pane { position: static; padding: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>plain-language comparison</h1>
  <div class="prompt-box"><div class="label">Prompt</div><div id="prompt"></div></div>
  <div class="about-label">Setup</div>
  <table class="about" id="about"></table>
  <div class="toolbar">
    <div class="group" id="sample-buttons"><span>Sample in every pane:</span></div>
    <div class="group annotation-controls">
      <label><input type="checkbox" id="show-annotations" checked> <span id="show-annotations-label">Show annotations</span></label>
      <span id="annotation-status"></span>
      <button type="button" class="chip" id="save-annotations">Save annotations</button>
    </div>
  </div>
</header>
<main id="panes"></main>

<script>

<!-- annotations.js next to this page declares `annotations`; the page works without it. -->
<script src="annotations.js" charset="utf-8"></script>
<script>
const comparison = __COMPARISON_JSON__;
const promptTexts = __PROMPT_JSON__;
const sampleTexts = __SAMPLES_JSON__;

// A cell is one set of principles under one model. Panes show one sample of
// one cell each; the reader arranges the panes.
const cells = [];
for (const model of comparison.models) {
  for (const principles of comparison.principles) {
    cells.push({ modelLabel: model.label, principles: principles });
  }
}
// A pane can also show the source text the prompt works on, when there is one.
const SOURCE_PANE = -1;
const hasSource = Boolean(promptTexts.source);
let panes = [];

function isSourcePane(pane) {
  return pane.cell === SOURCE_PANE;
}

function cellNumberOf(modelLabel, principlesName) {
  return cells.findIndex(cell => cell.modelLabel === modelLabel && cell.principles.name === principlesName);
}

function samplesOf(cell) {
  return comparison.samples
    .filter(sample => sample.model_label === cell.modelLabel && sample.principles === cell.principles.name)
    .sort((left, right) => left.index - right.index);
}

function sampleText(cell, index) {
  const byPrinciples = sampleTexts[cell.modelLabel] || {};
  const byIndex = byPrinciples[cell.principles.name] || {};
  return byIndex[String(index)] || "";
}

function maxSampleIndex() {
  let highest = 0;
  for (const sample of comparison.samples) {
    if (sample.index > highest) highest = sample.index;
  }
  return highest;
}

function shortCommit(value) {
  if (typeof value !== "string") return "";
  return value.slice(0, 7);
}

function describePrinciples(principles) {
  if (principles.kind === "none") return "no principles";
  const parts = [];
  if (principles.kind === "git") {
    parts.push("git " + shortCommit(principles.commit));
  } else if (principles.kind === "worktree") {
    const edits = principles.uncommitted ? " with uncommitted edits" : "";
    parts.push("worktree at " + shortCommit(principles.base_commit) + edits);
  } else {
    parts.push(principles.kind);
  }
  if (principles.sha256) parts.push("sha256 " + shortCommit(principles.sha256));
  return parts.join(" · ");
}

function modelsUsed(modelLabel) {
  const used = new Set();
  for (const sample of comparison.samples) {
    if (sample.model_label === modelLabel && sample.model) used.add(sample.model);
  }
  return Array.from(used);
}

function formatStats(sample) {
  if (sample.is_error) return "failed";
  const parts = [];
  if (typeof sample.duration_ms === "number") parts.push((sample.duration_ms / 1000).toFixed(1) + " s");
  if (typeof sample.cost_usd === "number") parts.push("$" + sample.cost_usd.toFixed(3));
  const usage = sample.usage || {};
  if (typeof usage.output_tokens === "number") parts.push(usage.output_tokens + " output tokens");
  if (typeof usage.cache_read_input_tokens === "number" && usage.cache_read_input_tokens > 0) parts.push("cache read");
  return parts.join(" · ");
}

function promptFirstLine() {
  return promptTexts.prompt.split("\n")[0];
}

function renderPrompt() {
  const container = document.getElementById("prompt");
  const lines = promptTexts.prompt.split("\n");
  const hasMore = lines.length > 1 || Boolean(promptTexts.source);
  if (!hasMore) {
    const line = document.createElement("div");
    line.className = "prompt first-line";
    line.textContent = lines[0];
    container.appendChild(line);
    return;
  }
  const details = document.createElement("details");
  details.className = "prompt";
  const summary = document.createElement("summary");
  summary.textContent = lines[0];
  details.appendChild(summary);
  const promptText = document.createElement("pre");
  promptText.textContent = promptTexts.prompt;
  details.appendChild(promptText);
  if (promptTexts.source) {
    const sourceLabel = document.createElement("div");
    sourceLabel.className = "source-label";
    sourceLabel.textContent = "Source";
    details.appendChild(sourceLabel);
    const sourceText = document.createElement("pre");
    sourceText.textContent = promptTexts.source;
    details.appendChild(sourceText);
  }
  container.appendChild(details);
}

function addAboutRow(table, title, lines) {
  const row = document.createElement("tr");
  const heading = document.createElement("th");
  heading.textContent = title;
  const value = document.createElement("td");
  for (const line of lines) {
    const div = document.createElement("div");
    div.textContent = line;
    value.appendChild(div);
  }
  row.appendChild(heading);
  row.appendChild(value);
  table.appendChild(row);
}

// The rows follow the order of the script's options: prompt, principles, agent.
function renderAbout() {
  const table = document.getElementById("about");
  addAboutRow(table, "Created", [comparison.created_at]);
  if (comparison.prompt.report) addAboutRow(table, "Report", [comparison.prompt.report]);
  addAboutRow(table, "Principles", comparison.principles.map(principles => principles.name + " — " + describePrinciples(principles)));
  const agent = comparison.agent || {};
  if (agent.name) addAboutRow(table, "Agent", [agent.name + (agent.version ? " " + agent.version : "")]);
  addAboutRow(table, "Models", comparison.models.map(model => {
    const used = modelsUsed(model.label);
    return model.label + (used.length ? " → " + used.join(", ") : "");
  }));
  addAboutRow(table, "Effort", [comparison.effort]);
}

function renderSampleButtons() {
  const group = document.getElementById("sample-buttons");
  for (let index = 1; index <= maxSampleIndex(); index++) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    button.textContent = String(index);
    button.addEventListener("click", () => {
      for (const pane of panes) {
        if (isSourcePane(pane)) continue;
        const cell = cells[pane.cell];
        if (samplesOf(cell).some(sample => sample.index === index)) pane.index = index;
      }
      renderPanes();
    });
    group.appendChild(button);
  }
}

function renderSampleBody(container, cell, sample) {
  container.innerHTML = "";
  if (!sample) {
    container.textContent = "No sample.";
    return;
  }
  if (sample.is_error) {
    const failure = document.createElement("div");
    failure.className = "failure";
    failure.textContent = "This sample failed.\n" + (sample.error || "");
    container.appendChild(failure);
    return;
  }
  container.innerHTML = marked.parse(sampleText(cell, sample.index), { gfm: true, breaks: false });
  container.dataset.target = sample.file;
  markAnnotationsIn(container, sample.file);
}

function makeField(caption, select) {
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("div");
  label.className = "caption";
  label.textContent = caption;
  field.appendChild(label);
  field.appendChild(select);
  return field;
}

function makeSelect(className, title, options, selectedValue, onChange) {
  const select = document.createElement("select");
  select.className = className;
  select.title = title;
  for (const candidate of options) {
    const option = document.createElement("option");
    option.value = candidate.value;
    option.textContent = candidate.text;
    option.selected = candidate.value === selectedValue;
    select.appendChild(option);
  }
  select.addEventListener("change", () => onChange(select.value));
  return select;
}

function principlesOptions() {
  const options = comparison.principles.map(principles => ({ value: principles.name, text: principles.name }));
  if (hasSource) options.unshift({ value: "source", text: "source" });
  return options;
}

function makeCloseButton(paneNumber) {
  const close = document.createElement("button");
  close.type = "button";
  close.className = "close";
  close.title = "Close this pane";
  close.textContent = "×";
  close.addEventListener("click", () => {
    panes.splice(paneNumber, 1);
    renderPanes();
  });
  return close;
}

function renderSourcePane(pane, paneNumber) {
  const section = document.createElement("section");
  section.className = "pane";
  const header = document.createElement("div");
  header.className = "pane-header";
  const selectors = document.createElement("div");
  selectors.className = "selectors";
  selectors.appendChild(makeField("Principles", makeSelect("principles", "Principles shown in this pane", principlesOptions(), "source", value => {
    movePaneToCell(pane, comparison.models[0].label, value);
    renderPanes();
  })));
  if (panes.length > 1) selectors.appendChild(makeCloseButton(paneNumber));
  header.appendChild(selectors);
  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = "the source text the prompt works on";
  header.appendChild(stats);
  const body = document.createElement("div");
  body.className = "sample";
  body.innerHTML = marked.parse(promptTexts.source, { gfm: true, breaks: false });
  body.dataset.target = comparison.prompt.source_file;
  markAnnotationsIn(body, comparison.prompt.source_file);
  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function movePaneToCell(pane, modelLabel, principlesName) {
  if (principlesName === "source" && hasSource) {
    pane.cell = SOURCE_PANE;
    return;
  }
  const cellNumber = cellNumberOf(modelLabel, principlesName);
  if (cellNumber < 0) return;
  pane.cell = cellNumber;
  const available = samplesOf(cells[cellNumber]);
  if (!available.some(candidate => candidate.index === pane.index) && available.length > 0) pane.index = available[0].index;
}

function renderPane(pane, paneNumber) {
  if (isSourcePane(pane)) return renderSourcePane(pane, paneNumber);
  const cell = cells[pane.cell];
  const samples = samplesOf(cell);
  const sample = samples.find(candidate => candidate.index === pane.index);

  const section = document.createElement("section");
  section.className = "pane";

  const header = document.createElement("div");
  header.className = "pane-header";
  const selectors = document.createElement("div");
  selectors.className = "selectors";

  selectors.appendChild(makeField("Principles", makeSelect("principles", "Principles shown in this pane", principlesOptions(), cell.principles.name, value => {
    movePaneToCell(pane, cell.modelLabel, value);
    renderPanes();
  })));

  const modelOptions = comparison.models.map(model => ({ value: model.label, text: model.label }));
  selectors.appendChild(makeField("Model", makeSelect("model", "Model shown in this pane", modelOptions, cell.modelLabel, value => {
    movePaneToCell(pane, value, cell.principles.name);
    renderPanes();
  })));

  const sampleOptions = samples.map(candidate => ({
    value: String(candidate.index),
    text: String(candidate.index) + (candidate.is_error ? " (failed)" : ""),
  }));
  selectors.appendChild(makeField("Sample", makeSelect("sample", "Sample shown in this pane", sampleOptions, String(pane.index), value => {
    pane.index = Number(value);
    renderPanes();
  })));

  if (panes.length > 1) selectors.appendChild(makeCloseButton(paneNumber));
  header.appendChild(selectors);

  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = sample ? formatStats(sample) : "";
  header.appendChild(stats);

  const body = document.createElement("div");
  body.className = "sample";
  renderSampleBody(body, cell, sample);

  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function renderAddPane() {
  const holder = document.createElement("div");
  holder.className = "add-pane";
  const button = document.createElement("button");
  button.type = "button";
  button.title = "Add a pane";
  button.textContent = "+";
  button.addEventListener("click", () => {
    const last = panes[panes.length - 1] || { cell: 0, index: 1 };
    const samples = isSourcePane(last) ? [] : samplesOf(cells[last.cell]);
    const next = samples.find(sample => sample.index > last.index);
    panes.push({ cell: last.cell, index: next ? next.index : last.index });
    renderPanes();
  });
  holder.appendChild(button);
  return holder;
}

function renderPanes() {
  closePopover();
  const main = document.getElementById("panes");
  main.innerHTML = "";
  main.style.setProperty("--pane-count", String(panes.length));
  panes.forEach((pane, paneNumber) => main.appendChild(renderPane(pane, paneNumber)));
  main.appendChild(renderAddPane());
  writeArrangementToHash();
}

function defaultPanes() {
  const defaults = cells.map((cell, cellNumber) => {
    const samples = samplesOf(cell);
    return { cell: cellNumber, index: samples.length ? samples[0].index : 1 };
  });
  if (hasSource) defaults.unshift({ cell: SOURCE_PANE, index: 0 });
  return defaults;
}

// The arrangement lives in the URL fragment as
// "model,principles,index;model,principles,index", each label URI-encoded,
// with "source" for a pane that shows the source text, so that a link can
// carry a particular way of reading the comparison.
function writeArrangementToHash() {
  const parts = panes.map(pane => {
    if (isSourcePane(pane)) return "source";
    const cell = cells[pane.cell];
    return [encodeURIComponent(cell.modelLabel), encodeURIComponent(cell.principles.name), pane.index].join(",");
  });
  history.replaceState(null, "", "#" + parts.join(";"));
}

function readArrangementFromHash() {
  const hash = location.hash.replace(/^#/, "");
  if (hash === "") return null;
  const read = [];
  for (const part of hash.split(";")) {
    if (part === "source" && hasSource) {
      read.push({ cell: SOURCE_PANE, index: 0 });
      continue;
    }
    const fields = part.split(",");
    if (fields.length !== 3) continue;
    const cellNumber = cellNumberOf(decodeURIComponent(fields[0]), decodeURIComponent(fields[1]));
    const index = Number(fields[2]);
    if (cellNumber < 0 || !Number.isInteger(index)) continue;
    read.push({ cell: cellNumber, index: index });
  }
  return read.length ? read : null;
}

// An annotation marks a span of one sample, or of the source text, as good
// or bad, with a note. The span is the quoted text as the page shows it and
// the number of the occurrence, counted from 1, so that a person or an agent
// can write the same file by hand.
const ANNOTATIONS_FILE_NAME = "annotations.js";
const ANNOTATIONS_FORMAT_VERSION = 1;
const ANNOTATION_KINDS = ["good", "bad"];

let annotationList = readAnnotationsFile();
// While hidden, the page shows the replies plain and adds no annotations.
let annotationsShown = true;
let annotationsFileHandle = null;
let unsavedChanges = false;
let popover = null;

function readAnnotationsFile() {
  if (typeof annotations === "undefined") return [];
  if (!Array.isArray(annotations.annotations)) return [];
  const read = [];
  for (const annotation of annotations.annotations) {
    if (typeof annotation.target !== "string" || typeof annotation.quote !== "string") continue;
    if (!ANNOTATION_KINDS.includes(annotation.kind)) continue;
    read.push({
      target: annotation.target,
      quote: annotation.quote,
      occurrence: Number.isInteger(annotation.occurrence) && annotation.occurrence > 0 ? annotation.occurrence : 1,
      kind: annotation.kind,
      note: typeof annotation.note === "string" ? annotation.note : "",
    });
  }
  return read;
}

function annotationsFileText() {
  const content = { format: ANNOTATIONS_FORMAT_VERSION, annotations: annotationList };
  return "const annotations = " + JSON.stringify(content, null, 2) + ";\n";
}

// The text of a container as one string, with the text nodes that make it
// up and where each begins, so that a position in the string maps back to
// a node.
function textStreamOf(container) {
  const nodes = [];
  const starts = [];
  let text = "";
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node = walker.nextNode();
  while (node) {
    nodes.push(node);
    starts.push(text.length);
    text += node.nodeValue;
    node = walker.nextNode();
  }
  return { nodes: nodes, starts: starts, text: text };
}

function positionOfOccurrence(text, quote, occurrence) {
  let position = -1;
  for (let found = 0; found < occurrence; found++) {
    position = text.indexOf(quote, position + 1);
    if (position < 0) return -1;
  }
  return position;
}

function occurrenceAt(text, quote, position) {
  let occurrence = 0;
  let searchFrom = 0;
  while (true) {
    const found = text.indexOf(quote, searchFrom);
    if (found < 0 || found > position) return occurrence;
    occurrence++;
    searchFrom = found + 1;
  }
}

function markAnnotationsIn(container, target) {
  if (!annotationsShown) return;
  for (const annotation of annotationList) {
    if (annotation.target !== target) continue;
    const stream = textStreamOf(container);
    const start = positionOfOccurrence(stream.text, annotation.quote, annotation.occurrence);
    if (start < 0) {
      console.warn("Annotation not found in " + target + ": " + JSON.stringify(annotation.quote));
      continue;
    }
    wrapStreamRangeInMarks(stream, start, start + annotation.quote.length, annotation);
  }
}

// Splits every text node that overlaps the range and wraps the overlapping
// piece, because one mark element cannot cross element boundaries.
function wrapStreamRangeInMarks(stream, start, end, annotation) {
  for (let number = 0; number < stream.nodes.length; number++) {
    const node = stream.nodes[number];
    const nodeStart = stream.starts[number];
    const nodeEnd = nodeStart + node.nodeValue.length;
    const overlapStart = Math.max(start, nodeStart);
    const overlapEnd = Math.min(end, nodeEnd);
    if (overlapStart >= overlapEnd) continue;
    let piece = node;
    if (overlapStart > nodeStart) piece = node.splitText(overlapStart - nodeStart);
    if (overlapEnd < nodeEnd) piece.splitText(overlapEnd - overlapStart);
    const mark = makeMark(annotation);
    piece.parentNode.insertBefore(mark, piece);
    mark.appendChild(piece);
  }
}

function describeAnnotation(annotation) {
  if (annotation.note === "") return annotation.kind;
  return annotation.kind + "\n" + annotation.note;
}

function makeMark(annotation) {
  const mark = document.createElement("mark");
  mark.className = "annotation " + annotation.kind;
  mark.title = describeAnnotation(annotation);
  mark.addEventListener("click", event => {
    event.stopPropagation();
    showAnnotationPopover(annotation, mark.getBoundingClientRect());
  });
  return mark;
}

function sampleBodyContaining(node) {
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  if (!element) return null;
  return element.closest(".sample");
}

// A selection boundary is a text node with an offset, or an element with
// the number of the child before which the boundary sits.
function streamPositionOf(stream, container, offset) {
  if (container.nodeType === Node.TEXT_NODE) {
    const number = stream.nodes.indexOf(container);
    if (number < 0) return null;
    return stream.starts[number] + offset;
  }
  const childAfterBoundary = container.childNodes[offset];
  if (childAfterBoundary) return positionBeforeNode(stream, childAfterBoundary);
  return positionAfterNode(stream, container);
}

function positionBeforeNode(stream, node) {
  for (let number = 0; number < stream.nodes.length; number++) {
    const textNode = stream.nodes[number];
    if (textNode === node) return stream.starts[number];
    const relation = node.compareDocumentPosition(textNode);
    if (relation & (Node.DOCUMENT_POSITION_CONTAINED_BY | Node.DOCUMENT_POSITION_FOLLOWING)) return stream.starts[number];
  }
  return stream.text.length;
}

function positionAfterNode(stream, node) {
  for (let number = 0; number < stream.nodes.length; number++) {
    const textNode = stream.nodes[number];
    const relation = node.compareDocumentPosition(textNode);
    const isInside = relation & Node.DOCUMENT_POSITION_CONTAINED_BY;
    if (!isInside && relation & Node.DOCUMENT_POSITION_FOLLOWING) return stream.starts[number];
  }
  return stream.text.length;
}

function handleSelectionEnd(event) {
  if (!annotationsShown) return;
  if (popover && popover.contains(event.target)) return;
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || selection.rangeCount === 0) return;
  const range = selection.getRangeAt(0);
  const body = sampleBodyContaining(range.commonAncestorContainer);
  if (!body || !body.dataset.target) return;
  const stream = textStreamOf(body);
  const start = streamPositionOf(stream, range.startContainer, range.startOffset);
  const end = streamPositionOf(stream, range.endContainer, range.endOffset);
  if (start === null || end === null || start >= end) return;
  const quote = stream.text.slice(start, end);
  if (quote.trim() === "") return;
  const span = { target: body.dataset.target, quote: quote, occurrence: occurrenceAt(stream.text, quote, start) };
  showNewAnnotationPopover(span, range.getBoundingClientRect());
}

// Wide enough for the four buttons of the editing form on one line.
const POPOVER_WIDTH_PIXELS = 420;
const POPOVER_HEIGHT_ESTIMATE_PIXELS = 230;

// The popover is placed in document coordinates, so that it stays next to
// the span while the page scrolls.
function openPopover(anchorRect) {
  closePopover();
  popover = document.createElement("div");
  popover.className = "popover";
  popover.style.width = POPOVER_WIDTH_PIXELS + "px";
  popover.addEventListener("mousedown", event => event.stopPropagation());
  popover.addEventListener("mouseup", event => event.stopPropagation());
  document.body.appendChild(popover);
  const leftInViewport = Math.max(16, Math.min(anchorRect.left, window.innerWidth - POPOVER_WIDTH_PIXELS - 16));
  popover.style.left = (leftInViewport + window.scrollX) + "px";
  const fitsBelow = anchorRect.bottom + POPOVER_HEIGHT_ESTIMATE_PIXELS < window.innerHeight;
  const topInViewport = fitsBelow ? anchorRect.bottom + 6 : Math.max(16, anchorRect.top - POPOVER_HEIGHT_ESTIMATE_PIXELS - 6);
  popover.style.top = (topInViewport + window.scrollY) + "px";
  return popover;
}

function closePopover() {
  if (!popover) return;
  popover.remove();
  popover = null;
}

function appendQuoteLine(container, quote) {
  const line = document.createElement("div");
  line.className = "quote";
  line.textContent = "“" + quote + "”";
  line.title = quote;
  container.appendChild(line);
}

function makeChipButton(text, className, onClick) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "chip " + className;
  button.textContent = text;
  button.addEventListener("click", onClick);
  return button;
}

// The form for a new annotation and for an existing one: a note and one
// submit button per kind, so that choosing the kind and submitting take one
// click. Returns the actions row so that the caller can add its own buttons.
function appendAnnotationForm(container, initialNote, verb, onSubmit) {
  const noteLabel = document.createElement("label");
  noteLabel.textContent = "Note";
  const noteInput = document.createElement("textarea");
  noteInput.value = initialNote;
  noteLabel.appendChild(noteInput);
  container.appendChild(noteLabel);

  const actions = document.createElement("div");
  actions.className = "actions";
  for (const kind of ANNOTATION_KINDS) {
    actions.appendChild(makeChipButton(verb + " as " + kind, kind, () => {
      onSubmit(kind, noteInput.value);
    }));
  }
  const spacer = document.createElement("span");
  spacer.className = "spacer";
  actions.appendChild(spacer);
  container.appendChild(actions);
  noteInput.focus();
  return actions;
}

function showNewAnnotationPopover(span, anchorRect) {
  const container = openPopover(anchorRect);
  appendQuoteLine(container, span.quote);
  const actions = appendAnnotationForm(container, "", "Add", (kind, noteText) => {
    addAnnotation(span, kind, noteText);
  });
  actions.appendChild(makeChipButton("Cancel", "", closePopover));
}

function addAnnotation(span, kind, noteText) {
  annotationList.push({
    target: span.target,
    quote: span.quote,
    occurrence: span.occurrence,
    kind: kind,
    note: noteText.trim(),
  });
  window.getSelection().removeAllRanges();
  recordChange();
}

function showAnnotationPopover(annotation, anchorRect) {
  const container = openPopover(anchorRect);
  appendQuoteLine(container, annotation.quote);
  const kind = document.createElement("div");
  kind.className = "kind " + annotation.kind;
  kind.textContent = "marked as " + annotation.kind;
  container.appendChild(kind);
  const actions = appendAnnotationForm(container, annotation.note, "Save", (newKind, noteText) => {
    updateAnnotation(annotation, newKind, noteText);
  });
  actions.appendChild(makeChipButton("Delete", "", () => deleteAnnotation(annotation)));
  actions.appendChild(makeChipButton("Cancel", "", closePopover));
}

function updateAnnotation(annotation, kind, noteText) {
  annotation.kind = kind;
  annotation.note = noteText.trim();
  recordChange();
}

function deleteAnnotation(annotation) {
  annotationList = annotationList.filter(candidate => candidate !== annotation);
  recordChange();
}

function recordChange() {
  unsavedChanges = true;
  renderPanes();
  renderAnnotationStatus();
}

function comparisonDirectoryPath() {
  // On Windows the path of a file URL begins with a slash before the drive letter.
  const path = decodeURIComponent(location.pathname).replace(/^\/(?=[A-Za-z]:)/, "");
  return path.slice(0, path.lastIndexOf("/") + 1);
}

function canSaveFiles() {
  return typeof window.showSaveFilePicker === "function";
}

function renderAnnotationStatus() {
  document.getElementById("show-annotations-label").textContent = "Show annotations (" + annotationList.length + ")";
  const status = document.getElementById("annotation-status");
  status.className = "unsaved";
  status.textContent = unsavedChanges ? "unsaved" : "";
  const button = document.getElementById("save-annotations");
  button.disabled = !canSaveFiles();
  button.title = canSaveFiles()
    ? "Write " + ANNOTATIONS_FILE_NAME + " into " + comparisonDirectoryPath()
    : "This browser has no File System Access API, so the page cannot save annotations.";
}

async function chooseAnnotationsFile() {
  return window.showSaveFilePicker({
    suggestedName: ANNOTATIONS_FILE_NAME,
    types: [{ description: "Annotations", accept: { "text/javascript": [".js"] } }],
  });
}

async function saveAnnotations() {
  if (!canSaveFiles()) return;
  try {
    if (!annotationsFileHandle) annotationsFileHandle = await chooseAnnotationsFile();
    const writable = await annotationsFileHandle.createWritable();
    await writable.write(annotationsFileText());
    await writable.close();
  } catch (error) {
    if (error.name === "AbortError") return;
    alert("Could not save " + ANNOTATIONS_FILE_NAME + ": " + error.message);
    return;
  }
  unsavedChanges = false;
  renderAnnotationStatus();
}

// The popover closes on mousedown, before a new selection ends, so that the
// mouseup that ends the selection can open the next one.
document.addEventListener("mousedown", closePopover);
document.addEventListener("mouseup", handleSelectionEnd);
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePopover();
});
document.getElementById("save-annotations").addEventListener("click", saveAnnotations);
document.getElementById("show-annotations").addEventListener("change", event => {
  annotationsShown = event.target.checked;
  renderPanes();
});
window.addEventListener("beforeunload", event => {
  if (!unsavedChanges) return;
  event.preventDefault();
  event.returnValue = "";
});

document.title = promptFirstLine().slice(0, 60) + " — plain-language comparison";
renderPrompt();
renderAbout();
renderSampleButtons();
renderAnnotationStatus();
panes = readArrangementFromHash() || defaultPanes();
renderPanes();
</script>
</body>
</html>
